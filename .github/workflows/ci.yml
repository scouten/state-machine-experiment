# CI for the contentauth-state-machine prototype.
#
# Inspired by (and simplified from) the c2pa-rs tier-1a workflow. This repo
# is a workspace with a single member crate today, so the feature-matrix and
# multi-platform machinery from c2pa-rs is omitted; it can be reintroduced if
# / when the experiment grows.

name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit tests + code coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master@2026-06-30
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@4684b8405694ae9dd42c9f39ba901a70ae83f4a3 # v2.82.9
        with:
          tool: cargo-llvm-cov

      - name: Generate code coverage
        env:
          RUST_BACKTRACE: "1"
        run: cargo llvm-cov --all-features --tests --lcov --output-path lcov.info

      # Test code itself shouldn't count for or against coverage.
      - name: Filter out tests
        uses: scouten/uncover-tests@af7baaca5bf5189b968573d5f14627c2e1ea0704 # v1.1.0
        with:
          input-file: lcov.info
          output-file: lcov.filtered.info

      # Tokens aren't available for PRs originating from forks,
      # so we don't attempt to upload code coverage in that case.
      - name: Upload code coverage results
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true
          files: ./lcov.filtered.info

  doc-tests:
    name: Doc tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master@2026-06-30
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Run doc tests
        env:
          RUST_BACKTRACE: "1"
        run: cargo test --all-features --doc

  clippy:
    name: Clippy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master@2026-06-30
        with:
          toolchain: stable
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Run Clippy
        run: cargo clippy --all-features --all-targets -- -Dwarnings

  cargo_fmt:
    name: Enforce Rust code format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master@2026-06-30
        with:
          # rustfmt.toml uses unstable options; pinned to match c2pa-rs.
          toolchain: nightly-2026-01-16
          components: rustfmt

      - name: Check format
        run: cargo +nightly-2026-01-16 fmt --all -- --check

  docs:
    name: Doc build (stable, warnings denied)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master@2026-06-30
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Build docs
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo doc --no-deps --all-features

  wasm:
    name: Wasm build checks
    runs-on: ubuntu-latest

    # This is meant to become a portable core with no I/O, threads, network,
    # or clock dependencies, so it should build for Wasm targets unmodified.
    # Enforced from day one.
    #
    # `contentauth-c2pa-rs-compat` and `contentauth-c2pa-rs-compat-sign` are
    # excluded: they are deliberately the only crates in this workspace that
    # own a concrete network dependency (the former's default OCSP host, the
    # latter's default RFC 3161 timestamp transport, both built on
    # `reqwest`), so they are not held to the portable-core constraint the
    # rest of the workspace is.
    #
    # `contentauth-c2pa-js-compat` is *included*, and `--all-features`
    # matters for it: its `web` feature (the wasm-bindgen end of the
    # crate) only compiles for wasm32-unknown-unknown, and this is the
    # only place it is ever built, since no CI job has a browser to run it
    # in. On wasm32-wasip2 the same feature is a no-op by design.
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master@2026-06-30
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown, wasm32-wasip2

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: "`cargo check` for wasm32-unknown-unknown"
        run: cargo check --all-features --target wasm32-unknown-unknown --workspace --exclude contentauth-c2pa-rs-compat --exclude contentauth-c2pa-rs-compat-sign

      - name: "`cargo check` for wasm32-wasip2"
        run: cargo check --all-features --target wasm32-wasip2 --workspace --exclude contentauth-c2pa-rs-compat --exclude contentauth-c2pa-rs-compat-sign

  msrv:
    name: MSRV build check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust toolchain (MSRV)
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master@2026-06-30
        with:
          # Keep in sync with rust-version in Cargo.toml.
          toolchain: 1.96.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: "`cargo check` with MSRV"
        run: cargo check --all-features --all-targets

  cargo-deny:
    name: License / vulnerability audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Audit crate dependencies
        uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        with:
          command: check advisories bans licenses sources

  compat-conformance:
    name: c2pa-rs-compat-conformance tests
    runs-on: ubuntu-latest

    # c2pa-rs-compat-conformance is deliberately its own Cargo workspace,
    # not a member of the root one (see its own README): it depends on the
    # real c2pa crate, which none of the jobs above ever touch. Run here
    # instead, scoped to its own manifest, so it's still exercised on every
    # PR without pulling that dependency into the root workspace's Wasm,
    # MSRV, or license/advisory checks.
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master@2026-06-30
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: c2pa-rs-compat-conformance -> target

      - name: Run tests
        run: cargo test --manifest-path c2pa-rs-compat-conformance/Cargo.toml

  asset-io-comparison:
    name: asset-io-comparison tests
    runs-on: ubuntu-latest

    # Its own Cargo workspace, like compat-conformance above: it takes a
    # pinned git dependency on Gavin Peacock's asset-io, which the root
    # workspace's checks (Wasm, MSRV, cargo-deny's source allow-list) do
    # not want swept in. The test asserts the timed variants write the
    # same bytes (asset-io's output matches this workspace's outside the
    # manifest) and that ours read back as trusted; the timings are
    # `cargo run --release`, not CI.
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master@2026-06-30
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: asset-io-comparison -> target

      - name: Run tests
        run: cargo test --manifest-path asset-io-comparison/Cargo.toml

  node-addon:
    name: c2pa-node-compat-addon tests (real Node)
    runs-on: ubuntu-latest

    # The Neon addon is its own Cargo workspace, like compat-conformance
    # above: a `cdylib` leaves N-API symbols for the Node process that
    # loads it to resolve, so the workspace-wide `--all-features` test and
    # coverage jobs could not link it. Built here, then exercised by
    # loading it into Node and driving the synchronous Rust session from
    # JavaScript.
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master@2026-06-30
        with:
          toolchain: stable
          components: clippy, llvm-tools-preview

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: c2pa-node-compat-addon -> target

      - name: Clippy
        run: cargo clippy --manifest-path c2pa-node-compat-addon/Cargo.toml -- -Dwarnings

      - name: Build addon
        working-directory: c2pa-node-compat-addon
        run: npm run build

      - name: Run tests under Node
        working-directory: c2pa-node-compat-addon
        run: npm test

      # Both halves of the Node side from one instrumented run: the
      # JavaScript driver (Node's built-in coverage) and the Rust addon
      # (cargo-llvm-cov, exercised by loading it into Node). See
      # `c2pa-node-compat-addon/coverage.sh`.
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@4684b8405694ae9dd42c9f39ba901a70ae83f4a3 # v2.82.9
        with:
          tool: cargo-llvm-cov

      - name: Install llvm-tools
        run: rustup component add llvm-tools-preview

      - name: Generate code coverage
        working-directory: c2pa-node-compat-addon
        run: ./coverage.sh

      # Tokens aren't available for PRs originating from forks,
      # so we don't attempt to upload code coverage in that case.
      - name: Upload code coverage results
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true
          flags: node-addon
          files: ./c2pa-node-compat-addon/lcov.info,./c2pa-node-compat-addon/lcov.rust.info

  node-sign-addon:
    name: c2pa-node-sign-addon tests (real Node)
    runs-on: ubuntu-latest

    # Own Cargo workspace, like the reader addon above, for the same
    # reason. Its read-back tests load the reader addon, so that is built
    # first.
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master@2026-06-30
        with:
          toolchain: stable
          components: clippy, llvm-tools-preview

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: |
            c2pa-node-compat-addon -> target
            c2pa-node-sign-addon -> target

      - name: Clippy
        run: cargo clippy --manifest-path c2pa-node-sign-addon/Cargo.toml -- -Dwarnings

      - name: Build reader addon (for read-back)
        working-directory: c2pa-node-compat-addon
        run: npm run build

      - name: Build addon
        working-directory: c2pa-node-sign-addon
        run: npm run build

      - name: Run tests under Node
        working-directory: c2pa-node-sign-addon
        run: npm test

      # Both halves, as for the reader addon: see
      # `c2pa-node-sign-addon/coverage.sh`.
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@4684b8405694ae9dd42c9f39ba901a70ae83f4a3 # v2.82.9
        with:
          tool: cargo-llvm-cov

      - name: Generate code coverage
        working-directory: c2pa-node-sign-addon
        run: ./coverage.sh

      - name: Upload code coverage results
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true
          flags: node-sign-addon
          files: ./c2pa-node-sign-addon/lcov.info,./c2pa-node-sign-addon/lcov.rust.info
