[package]
name = "contentauth-c2pa-c-api"
version = "0.1.0"
description = "cimpl-backed C ABI for sans-I/O C2PA reading and signing, leaving all I/O and scheduling to the host"
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["c2pa", "content-credentials", "c-api", "sans-io", "swift"]
categories = ["api-bindings"]
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
cimpl = "0.4.1"
contentauth-c2pa-file-builder = { path = "../contentauth-c2pa-file-builder" }
contentauth-c2pa-file-reader = { path = "../contentauth-c2pa-file-reader" }
contentauth-c2pa-format = { path = "../contentauth-c2pa-format" }
contentauth-c2pa-format-registry = { path = "../contentauth-c2pa-format-registry" }
contentauth-c2pa-js-compat = { path = "../contentauth-c2pa-js-compat" }
contentauth-c2pa-primitives = { path = "../contentauth-c2pa-primitives" }
contentauth-c2pa-sign-baseline = { path = "../contentauth-c2pa-sign-baseline" }
contentauth-state-machine = { path = "../contentauth-state-machine" }
serde_json = "1"
thiserror = "2.0.21"

[build-dependencies]
cbindgen = "0.27"

[dev-dependencies]
c2pa_raw_crypto = { version = "0.1.2", default-features = false, features = [
    "rust_native_crypto",
] }
contentauth-c2pa-sign-baseline = { path = "../contentauth-c2pa-sign-baseline", features = [
    "fixtures",
] }
