[package]
name = "contentauth-c2pa-c-api"
version = "0.1.0"
description = "cimpl-backed C ABI for sans-I/O C2PA reading and signing, leaving all I/O and scheduling to the host"
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["c2pa", "content-credentials", "c-api", "sans-io", "swift"]
categories = ["api-bindings"]
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[features]
default = ["read", "build"]
read = ["dep:contentauth-c2pa-session-bridge"]
build = ["dep:contentauth-c2pa-session-bridge"]

[dependencies]
cimpl = "0.4.1"
contentauth-c2pa-session-bridge = { path = "../contentauth-c2pa-session-bridge", optional = true }

[build-dependencies]
cbindgen = "0.27"

[dev-dependencies]
serde_json = "1"
base64 = "0.22"
c2pa_raw_crypto = { version = "0.2.0", default-features = false, features = [
    "rust_native_crypto",
] }
contentauth-c2pa-sign-baseline = { path = "../contentauth-c2pa-sign-baseline", features = [
    "fixtures",
] }
