language = "C"
include_guard = "CONTENTAUTH_C2PA_C_API_H"
autogen_warning = "/* Generated by cbindgen. Do not edit manually. */"
documentation = true
style = "both"
no_includes = false
cpp_compat = true
after_includes = """
#ifndef C2PA_SM_NO_DEFAULT_FEATURES
#define C2PA_SM_FEATURE_READ
#define C2PA_SM_FEATURE_BUILD
#endif
"""

[defines]
"feature = read" = "C2PA_SM_FEATURE_READ"
"feature = build" = "C2PA_SM_FEATURE_BUILD"

[parse]
parse_deps = false

[export]
include = [
    "C2paSmReadRequest",
    "C2paSmBuildRequest",
    "C2paSmExclusion",
    "C2paSmExclusionList",
    "C2paSmReadSession",
    "C2paSmBuildSession",
]
