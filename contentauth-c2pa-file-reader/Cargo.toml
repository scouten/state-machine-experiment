[package]
name = "contentauth-c2pa-file-reader"
version = "0.1.0"
description = "Reads and validates a C2PA manifest store directly from a file, gluing a contentauth-c2pa-format handler to contentauth-c2pa-reader"
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["c2pa", "content-credentials", "sans-io"]
categories = ["api-bindings"]
publish = false

[dependencies]
contentauth-state-machine = { path = "../contentauth-state-machine" }

# The contract every container-format handler implements: this crate is
# generic over any `FormatHandler`, not just JPEG.
contentauth-c2pa-format = { path = "../contentauth-c2pa-format" }

# The read/validate engine this crate feeds from the same bytes it hands
# the format handler.
contentauth-c2pa-reader = { path = "../contentauth-c2pa-reader" }

# `ByteRange`, `HostError`, `StreamId` — the handles both sessions above
# address their host with.
contentauth-c2pa-primitives = { path = "../contentauth-c2pa-primitives" }

thiserror = "2.0.20"

[dev-dependencies]
# The JPEG handler this crate's own tests exercise.
contentauth-c2pa-format-jpeg = { path = "../contentauth-c2pa-format-jpeg" }
# `test_util::MemoryHost`, used only to build a signed test fixture (the
# same way `contentauth-c2pa-format-jpeg`'s own tests do) before handing
# it to this crate's own file-reading API. Not used by this crate's
# production code, which drives handlers itself (see `src/drive.rs`).
contentauth-c2pa-format = { path = "../contentauth-c2pa-format", features = [
    "test-util",
] }
# Builds and signs a manifest for the round-trip test.
contentauth-c2pa-builder = { path = "../contentauth-c2pa-builder" }
# Test-only: plays the "host signer" in the round-trip test, exactly as
# contentauth-c2pa-builder's own tests do. See deny.toml for why its `rsa`
# advisory is accepted for test-only use.
c2pa_raw_crypto = { version = "0.1.2", default-features = false, features = [
    "rust_native_crypto",
] }
