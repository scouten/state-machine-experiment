[build-system]
requires = ["setuptools>=77", "cffi>=1.17.1"]
build-backend = "setuptools.build_meta"

[project]
name = "contentauth-c2pa-python"
version = "0.1.0"
description = "Experimental Python bindings for the sans-I/O C2PA sessions"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
dependencies = ["cffi>=1.17.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=6", "mypy>=1.14", "setuptools>=77", "cryptography>=44"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
contentauth_c2pa = ["py.typed", "*.pyi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.coverage.run]
branch = true
source = ["contentauth_c2pa", "_build", "_package_setup"]

[tool.coverage.report]
show_missing = true
fail_under = 100

[tool.mypy]
strict = true
files = ["src/contentauth_c2pa"]

# Wheels are built from the *repository root* (`cibuildwheel` with `package-dir`), because
# the build compiles the workspace's C API with cargo. See `.github/workflows/python-wheels.yml`.
[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-*"
build-verbosity = 1
test-requires = ["pytest>=8", "cryptography>=44"]
# The tests read fixtures from sibling crates, which the build containers mount whole.
test-command = "cd {package} && python -m pytest -q -p no:cacheprovider"

[tool.cibuildwheel.linux]
before-all = "curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal"
environment = { PATH = "$HOME/.cargo/bin:$PATH" }

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }

[[tool.cibuildwheel.overrides]]
select = "*-macosx_x86_64"
inherit.environment = "append"
environment = { MACOSX_DEPLOYMENT_TARGET = "10.15" }
