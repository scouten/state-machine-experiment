[package]
name = "contentauth-c2pa-session-bridge"
version = "0.1.0"
description = "Synchronous, host-driven read and build bridges for language bindings"
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"
publish = false

[dependencies]
contentauth-c2pa-file-reader = { path = "../contentauth-c2pa-file-reader" }
contentauth-c2pa-file-builder = { path = "../contentauth-c2pa-file-builder" }
contentauth-c2pa-reader = { path = "../contentauth-c2pa-reader" }
contentauth-c2pa-format-jpeg = { path = "../contentauth-c2pa-format-jpeg" }
contentauth-c2pa-primitives = { path = "../contentauth-c2pa-primitives" }
contentauth-c2pa-sign-baseline = { path = "../contentauth-c2pa-sign-baseline" }
contentauth-state-machine = { path = "../contentauth-state-machine" }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.20"

[dev-dependencies]
contentauth-c2pa-js-compat = { path = "../contentauth-c2pa-js-compat" }
contentauth-c2pa-rs-compat = { path = "../contentauth-c2pa-rs-compat" }
contentauth-c2pa-sign-baseline = { path = "../contentauth-c2pa-sign-baseline", features = ["fixtures"] }
c2pa_raw_crypto = { version = "0.1.2", default-features = false, features = ["rust_native_crypto"] }
