[package]
name = "contentauth-c2pa-web-bindings"
version = "0.1.0"
description = "Loadable browser artifact for the state-machine reader and baseline signer"
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
contentauth-c2pa-js-compat = { path = "../contentauth-c2pa-js-compat", features = ["web"] }
contentauth-c2pa-js-compat-sign = { path = "../contentauth-c2pa-js-compat-sign", features = ["web"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Blob"] }
