# Configuration used for dependency checking with cargo-deny.
#
# Simplified from the c2pa-rs configuration. For further details on all
# configuration options see:
# https://embarkstudios.github.io/cargo-deny/checks/cfg.html

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "aarch64-apple-darwin" },
    { triple = "wasm32-unknown-unknown" },
    { triple = "wasm32-wasip2" },
]

[advisories]
yanked = "deny"
ignore = [
    # RUSTSEC-2023-0071 — the Marvin Attack: `rsa` 0.9's private-key
    # operations leak timing information an attacker who can observe them
    # may use to recover the key. There is no fixed release.
    #
    # It reaches this workspace two ways, neither of which touches a
    # private key:
    #
    # * `contentauth-c2pa-primitives` -> `c2pa_raw_crypto` -> `rsa`, used
    #   only for `SigningAlg::raw()`, a pure enum mapping with no key
    #   material anywhere near it. `contentauth-c2pa-reader` reaches it
    #   transitively through this: the only RSA operation reachable from a
    #   read-only crate is signature *verification*, which is what the
    #   attack does not touch.
    # * `contentauth-c2pa-builder`'s *dev*-dependency on `c2pa_raw_crypto`,
    #   which plays the "host signer" in its own integration tests (and
    #   likewise `contentauth-c2pa-format-jpeg`'s, for its end-to-end
    #   build-embed-read test). Real signing keys never enter the shipped
    #   crates — the builder only ever asks a host to sign, over its
    #   `BuilderRequest::Sign` request — so this exposure is test-only and
    #   never reaches a published artifact.
    #
    # Revisit if `contentauth-c2pa-builder` ever grows an in-crate signing
    # path (contrary to its sans-I/O design), or if `rsa` ships a fix, at
    # which point this goes away.
    "RUSTSEC-2023-0071",
]

[bans]
multiple-versions = "deny"
skip = [
    # `syn` is duplicated only among build-time proc-macro crates
    # (serde_derive wants one major version, zerocopy-derive another).
    # Nothing of it reaches the compiled library, and the resolution is not
    # ours to make, so this one duplicate is tolerated while the ban stays
    # in force for everything else.
    { crate = "syn" },

    # The rest are one situation, not five: `c2pa_raw_crypto` straddles a
    # RustCrypto generation boundary. It uses `sha2` 0.11 directly (the
    # version `contentauth-c2pa-reader` uses too), while the signature
    # crates it wraps — `rsa` 0.9, `p256`/`p384`/`p521` 0.13, `ed25519-dalek`
    # 2 — are still on the 0.10 generation and pull `digest` 0.10 with it.
    #
    # None of this is ours to resolve: it clears when RustCrypto ships 0.11
    # for the signature crates and `c2pa_raw_crypto` moves up. Listed crate
    # by crate rather than switching the check to "warn", so a *new*
    # duplicate outside this set still fails the build.
    { crate = "block-buffer" },
    { crate = "const-oid" },
    { crate = "cpufeatures" },
    { crate = "crypto-common" },
    { crate = "digest" },
    { crate = "sha2" },

    # `reqwest` (contentauth-c2pa-rs-compat's default OCSP transport) wants
    # `base64` 0.23 directly, while `hyper-util` — one of its own
    # dependencies — is still on 0.22. Both live entirely inside
    # `reqwest`'s own dependency graph; this workspace has no `base64`
    # dependency of its own to align them with.
    { crate = "base64" },

    # Also entirely inside `reqwest`'s own dependency graph, and not this
    # workspace's to resolve:
    #
    # * `core-foundation` 0.9 (via `system-configuration`, for
    #   `reqwest`'s system-proxy support) vs. 0.10 (via
    #   `rustls-platform-verifier`/`security-framework`, for its default
    #   TLS certificate verification) — two macOS Security-framework
    #   binding generations reqwest's own dependencies have not
    #   converged on yet.
    # * `getrandom` 0.2 (the RustCrypto generation this workspace's own
    #   signing code already uses — see the `sha2` et al. entries above)
    #   vs. 0.4, pulled in only as a *build-time* dependency of
    #   `aws-lc-sys` (via `cc`/`jobserver`/`cmake`) and never linked into
    #   the compiled library.
    { crate = "core-foundation" },
    { crate = "getrandom" },
]

[licenses]
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # `webpki-root-certs` (a compiled-in Mozilla root certificate bundle,
    # pulled in transitively by `reqwest`'s default TLS stack via
    # `rustls-platform-verifier`) licenses the bundled *data* under this
    # license rather than one of the code licenses above. Permissive, and
    # the same license Mozilla's own root program uses for its CA
    # certificate data more broadly.
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
